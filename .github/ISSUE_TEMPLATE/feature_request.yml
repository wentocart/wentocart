name: '💡 Feature Request / Proposal'
description: 'Suggest an idea, enhancement, or new feature for WentoCart.'
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping make WentoCart better! Please describe your proposed feature or enhancement.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of the pain point or problem you are trying to solve.
      placeholder: 'I am always frustrated when...'
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You Would Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You Have Considered
      description: Any alternative solutions or features you've considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or mockup diagrams here.
